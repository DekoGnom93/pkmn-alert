
name: Test ntfy notification

"on":
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Send test notification
        run: |
          curl --fail --show-error \
            -H "Title: Pokemon Alert TEST" \
            -H "Priority: high" \
            -H "Tags: white_check_mark" \
            -d "Test erfolgreich! Dein Pokemon Alert kann Push-Nachrichten senden." \
            https://ntfy.sh/pkmnalertDekoGnom93
